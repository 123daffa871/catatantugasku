<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4f8cff">
    <title>TugasKu - Pengingat Tugas</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div>
        <h1>📚 TugasKu</h1>
        <p>Pengingat tugas untuk pelajar</p>
    </div>

    <button id="darkModeBtn" class="icon-btn">🌙</button>
</header>

<main class="container">

    <!-- Dashboard -->
    <section class="stats">
        <div class="stat-card">
            <span>📋</span>
            <div>
                <h3 id="totalTugas">0</h3>
                <p>Total Tugas</p>
            </div>
        </div>

        <div class="stat-card">
            <span>⏰</span>
            <div>
                <h3 id="tugasHariIni">0</h3>
                <p>Hari Ini</p>
            </div>
        </div>

        <div class="stat-card">
            <span>✅</span>
            <div>
                <h3 id="tugasSelesai">0</h3>
                <p>Selesai</p>
            </div>
        </div>

        <div class="stat-card">
            <span>🔥</span>
            <div>
                <h3 id="tugasTerlambat">0</h3>
                <p>Terlambat</p>
            </div>
        </div>
    </section>

    <!-- Tombol tambah -->
    <button id="openModalBtn" class="add-btn">
        ＋ Tambah Tugas
    </button>

    <!-- Tugas terdekat -->
    <section id="nearestTask" class="nearest-task">
        <h2>🔥 Deadline Terdekat</h2>
        <div id="nearestContent">
            <p>Belum ada tugas.</p>
        </div>
    </section>

    <!-- Search & Filter -->
    <section class="tools">

        <input
            type="text"
            id="searchInput"
            placeholder="🔍 Cari tugas..."
        >

        <select id="filterSubject">
            <option value="all">Semua Pelajaran</option>
        </select>

        <select id="filterStatus">
            <option value="all">Semua Status</option>
            <option value="pending">Belum Selesai</option>
            <option value="completed">Selesai</option>
            <option value="late">Terlambat</option>
        </select>

    </section>

    <!-- Daftar tugas -->
    <section>
        <div class="section-title">
            <h2>📝 Daftar Tugas</h2>
        </div>

        <div id="taskList" class="task-list">
            <!-- Tugas dibuat oleh JavaScript -->
        </div>

        <div id="emptyState" class="empty-state">
            <div>📚</div>
            <h3>Belum ada tugas</h3>
            <p>Tambahkan tugas pertamamu!</p>
        </div>
    </section>

</main>

<!-- Modal Tambah Tugas -->
<div id="taskModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">
            <h2>➕ Tambah Tugas</h2>
            <button id="closeModalBtn" class="close-btn">×</button>
        </div>

        <form id="taskForm">

            <label for="taskName">Nama Tugas</label>
            <input
                type="text"
                id="taskName"
                placeholder="Contoh: Membuat makalah"
                required
            >

            <label for="subject">Mata Pelajaran</label>
            <input
                type="text"
                id="subject"
                placeholder="Contoh: Bahasa Indonesia"
                required
            >

            <label for="description">Deskripsi</label>
            <textarea
                id="description"
                placeholder="Keterangan tugas..."
            ></textarea>

            <div class="form-row">

                <div>
                    <label for="deadline">Tanggal</label>
                    <input
                        type="date"
                        id="deadline"
                        required
                    >
                </div>

                <div>
                    <label for="time">Jam</label>
                    <input
                        type="time"
                        id="time"
                        required
                    >
                </div>

            </div>

            <label for="priority">Prioritas</label>

            <select id="priority">
                <option value="high">🔴 Penting</option>
                <option value="medium" selected>🟡 Sedang</option>
                <option value="low">🟢 Santai</option>
            </select>

            <label for="reminder">Pengingat</label>

            <select id="reminder">
                <option value="0">Saat deadline</option>
                <option value="15">15 menit sebelumnya</option>
                <option value="30">30 menit sebelumnya</option>
                <option value="60">1 jam sebelumnya</option>
                <option value="1440">1 hari sebelumnya</option>
            </select>

            <button type="submit" class="save-btn">
                💾 Simpan Tugas
            </button>

        </form>

    </div>
</div>

<!-- Toast -->
<div id="toast" class="toast">
    Tugas berhasil disimpan!
</div>

<script src="script.js"></script>

</body>
</html>
